# Automatiska uppdaterings-PR:ar (säkerhetschecklistan 10.3).
#
# Tre ekosystem: NuGet (backend), npm (frontend) och själva GitHub Actions-flödet.
# Veckovis — en ensam utvecklare hinner inte med daglig brusnivå, och säsongsappen
# har inte trafiken som gör en dags fördröjning till en risk. Säkerhetsuppdateringar
# skickar Dependabot ändå så fort de finns, oavsett schema.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # react och react-dom MÅSTE ha exakt samma version (annars "Incompatible React
    # versions" → hela testsviten faller, #678). Gruppera dem så Dependabot bumpar dem
    # i samma PR i stället för var för sig. Typerna följer med av samma skäl.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
