# Automatiska uppdaterings-PR:ar (säkerhetschecklistan 10.3).
#
# Tre ekosystem: NuGet (backend), npm (frontend) och själva GitHub Actions-flödet.
# Veckovis — en ensam utvecklare hinner inte med daglig brusnivå, och säsongsappen
# har inte trafiken som gör en dags fördröjning till en risk. Säkerhetsuppdateringar
# skickar Dependabot ändå så fort de finns, oavsett schema.
#
# GRUPPERING: utan den gör Dependabot en PR per paket OCH per projekt — en bump av
# Microsoft.Extensions.Options (som finns i både Application och Application.Tests) blev
# två PR:er som var för sig gav NU1605 "package downgrade" (#697/#700/#701). Grupperna nedan
# buntar alla minor/patch-uppdateringar till EN PR per ekosystem, som uppdaterar alla projekt
# konsekvent (ingen krock) och auto-mergas som en enda minor/patch (dependabot-auto-merge.yml).
# Major-bumpar lämnas utanför grupperna → kommer var för sig för manuell granskning.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Projektet riktar net10.0 (global.json SDK 10.0.100) och följer "senaste LTS" = .NET 10.
      # Major-bumpar av .NET-ramverkspaketen är .NET 11-linjen (STS, 18 mån) och hör till en
      # medveten ramverksmigrering av hela trädet på en gång — inte veckovisa Dependabot-PR:er,
      # som dessutom ger NU1605 "package downgrade" när de bumpas styckvis per projekt (#728–#735).
      # Minor/patch på 10.x-tåget släpps fortfarande igenom via gruppen ovan. Lyft den här
      # listan den dag vi aktivt byter TFM till net11.0.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # react och react-dom MÅSTE ha exakt samma version (annars "Incompatible React
      # versions" → hela testsviten faller, #678). Egen grupp, först, så den fångar dem i
      # samma PR även för en major. Typerna följer med av samma skäl.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
