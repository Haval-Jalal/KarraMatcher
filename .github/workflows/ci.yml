name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# En ny push till samma branch avbryter en pågående körning — vi behöver inte
# resultatet från kod som redan är ersatt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp .NET
        uses: actions/setup-dotnet@v4
        with:
          # Ingen version här: global.json i repo-roten bestämmer, så CI och
          # utvecklarmaskinen bygger med samma SDK.
          global-json-file: global.json

      - name: Cacha NuGet-paket
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Återställ paket
        run: dotnet restore

      - name: Bygg
        run: dotnet build --no-restore --configuration Release

      - name: Kontrollera formatering
        run: dotnet format --verify-no-changes --no-restore

      - name: Kör tester
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installera beroenden
        run: npm ci

      - name: Typkoll
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Kontrollera formatering
        run: npm run format:check

      - name: Kör tester
        run: npm test

      - name: Bygg
        run: npm run build
