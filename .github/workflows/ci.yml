name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# En ny push till samma branch avbryter en pågående körning — vi behöver inte
# resultatet från kod som redan är ersatt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Sätt upp .NET
        uses: actions/setup-dotnet@v6
        with:
          # Ingen version här: global.json i repo-roten bestämmer, så CI och
          # utvecklarmaskinen bygger med samma SDK.
          global-json-file: global.json

      - name: Cacha NuGet-paket
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Återställ paket
        run: dotnet restore

      - name: Bygg
        run: dotnet build --no-restore --configuration Release

      - name: Kontrollera formatering
        run: dotnet format --verify-no-changes --no-restore

      - name: Kör tester
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      # Sarbarhetsskanning (sakerhetschecklistan 10.1). `dotnet list` avslutar med 0 aven nar
      # den hittar nagot, sa vi faller bygget sjalva pa traffordet i utskriften.
      - name: Skanna beroenden
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.log
          if grep -q "has the following vulnerable" vuln.log; then
            echo "::error::Sårbara NuGet-paket hittades — se listan ovan."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Sätt upp Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installera beroenden
        run: npm ci

      # Sarbarhetsskanning (sakerhetschecklistan 10.2). Tva niver sa att grinden traffar ratt och
      # inte blir en som ignoreras (jfr brusnivan nedan):
      #  1. Allt som faktiskt *skeppas till anvandaren* (prod-beroenden) far inte ha en hog eller
      #     allvarlig sarbarhet — det ar appens riktiga angreppsyta.
      #  2. Hela tradet, inkl. bygg-/deploy-verktyg (devDependencies), far inte bara en *kritisk*
      #     sarbarhet. En hog sarbarhet i ren byggkedja som validerar var egen config utan
      #     otillforlitlig indata (t.ex. zod <4.6.6 inuti @vercel/config, som bara kor i Vercels
      #     bygge) ar ingen angreppsyta och ska inte falla bygget — annars blir grinden en som
      #     ignoreras. Appens egen zod ar 4.6.7 och traffas inte.
      - name: Skanna beroenden
        run: |
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=critical

      - name: Typkoll
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Kontrollera formatering
        run: npm run format:check

      - name: Kör tester
        run: npm test

      - name: Bygg
        run: npm run build

      - name: Prestandabudget
        run: npm run size
