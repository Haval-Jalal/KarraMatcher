# E2E-test av de fem kritiska flödena (#71, SPEC.md §9).
#
# Kör en riktig stack: Postgres, backend (migrerad + seedad, med den test-gejtade ytan på),
# och frontenden via Vite-dev över HTTPS (så refresh-cookien lagras). Playwright driver
# webbläsaren mot frontenden; /api proxas till backenden precis som i drift.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karra
          POSTGRES_PASSWORD: karra
          POSTGRES_DB: karra_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND_URL: http://localhost:5066
      FRONTEND_URL: https://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Sätt upp Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bygg backend
        working-directory: backend
        run: dotnet build src/KarraMatcher.Api --configuration Release

      - name: Starta backend
        working-directory: backend
        env:
          ConnectionStrings__Default: Host=localhost;Port=5432;Database=karra_e2e;Username=karra;Password=karra
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5066
          Database__ApplyMigrationsOnStartup: "true"
          Database__SeedOnStartup: "true"
          Testing__Enabled: "true"
          Auth__SigningKey: e2e-testnyckel-0123456789-0123456789-0123456789
          # Ingen omsändnings-cooldown i test: varje inloggning (samma konto loggar in
          # flera gånger i samåkningsflödet) ska alltid få en färsk kod direkt.
          Auth__LoginCodeResendCooldown: "00:00:00"
          # Höjda rate limits: hela sviten loggar in många gånger på en dryg minut från en
          # och samma IP, vilket annars slår i inloggnings- och den allmänna gränsen.
          RateLimiting__LoginPermitPerMinute: "1000"
          RateLimiting__PermitPerMinute: "1000"
        run: |
          dotnet run --project src/KarraMatcher.Api --configuration Release --no-build --no-restore > backend.log 2>&1 &
          echo "startar backend"

      - name: Vänta på backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$BACKEND_URL/health" > /dev/null; then echo "backend uppe"; exit 0; fi
            sleep 2
          done
          echo "backend startade inte"; cat backend/backend.log; exit 1

      - name: Installera frontend-beroenden
        working-directory: frontend
        run: npm ci

      - name: Installera Playwright-webbläsare
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Starta frontend
        working-directory: frontend
        env:
          E2E_HTTPS: "1"
          KARRA_API_PROXY: http://localhost:5066
        run: |
          npm run dev > frontend.log 2>&1 &
          echo "startar frontend"

      - name: Vänta på frontend
        run: |
          for i in $(seq 1 60); do
            if curl -skf "$FRONTEND_URL/" > /dev/null; then echo "frontend uppe"; exit 0; fi
            sleep 2
          done
          echo "frontend startade inte"; cat frontend/frontend.log; exit 1

      - name: Kör E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost:5173
          E2E_API_URL: http://localhost:5066
          CI: "true"
        run: npm run test:e2e

      - name: Ladda upp Playwright-rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Backend-logg vid fel
        if: failure()
        run: cat backend/backend.log || true
