# Render Blueprint. Definierar backend-tjansten som kod sa att uppsattningen inte
# bara bor i en dashboard dar ingen ser den.
#
# Peka Render pa repot och valj "New Blueprint" - den lasar den har filen.

services:
  - type: web
    name: karramatcher-api
    runtime: docker
    plan: free

    # Frankfurt. Samma region som Neon-databasen, och all data ska stanna inom EU.
    region: frankfurt

    branch: main
    autoDeploy: true

    # Byggkontexten ar repo-roten, sa att global.json och .editorconfig kommer med.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .

    # Render gor sin egen HTTP-halsokontroll. Darfor finns ingen HEALTHCHECK i
    # imagen - den skulle vara beroende av verktyg som inte finns i den slimmade
    # runtime-imagen, och rapportera unhealthy utan att nagon markte det.
    #
    # /health och inte /health/ready: liveness ror inte databasen, sa en hackande
    # databas far inte Render att starta om en container som i ovrigt fungerar.
    healthCheckPath: /health

    envVars:
      # Satts manuellt i Renders dashboard. sync: false betyder att vardet aldrig
      # kommer fran den har filen - hemligheter hor inte hemma i ett publikt repo.
      #
      # De listas anda har, utan varde. En hemlighet som inte namns nagonstans gar
      # inte att sakna: PR #30 gjorde Auth__SigningKey och Email__ApiKey obligatoriska
      # vid uppstart utan att de skrevs in har, och fran 30 augusti till 6 september
      # foll varje driftsattning pa uppstarten. Render beholl den gamla friska
      # containern, sa API:t svarade hela tiden -- med en vecka gammal kod. Listade
      # har visar Render en tom ruta i stallet for att felet gommer sig i en logg.
      - key: ConnectionStrings__Default
        sync: false

      # Signeringsnyckeln for access-tokens. Minst 32 tecken. AuthOptions valideras
      # med ValidateOnStart, sa en saknad eller for kort nyckel faller driftsattningen
      # i stallet for forsta inloggningen. Aldrig samma varde som lokalt.
      - key: Auth__SigningKey
        sync: false

      # API-nyckel hos Resend, for inloggningskoderna. Saknas den kastar AddEmail vid
      # uppstart utanfor utveckling -- att tyst inte skicka koder ar samre an att inte
      # starta alls.
      - key: Email__ApiKey
        sync: false

      # VAPID-nycklarna for notiser (#60). Push ar avstangt om de saknas -- appen
      # fungerar anda, kalenderfeeden ar den primara kanalen. Listade har av samma
      # skal som ovan: en tom ruta i dashboarden ar lattare att upptacka an en
      # funktion som tyst aldrig slas pa.
      #
      # Genereras med: dotnet run --project src/KarraMatcher.Api -- --vapid
      - key: Push__PublicKey
        sync: false

      - key: Push__PrivateKey
        sync: false

      - key: Push__Subject
        sync: false

      # Delad hemlighet for kvallspaminnelsens jobb-endpoint (#64). Samma varde satts i
      # Vercel som CRON_SECRET; Vercels cron bar den i Authorization, rewriten skickar den
      # vidare hit. Tom hemlighet stanger jobbet i stallet for att oppna det.
      - key: Jobs__Secret
        sync: false

      # Passkeys (WebAuthn). RelyingPartyId maste vara appens doman (utan protokoll, t.ex.
      # "karramatcher.se") och Origins den publika https-adressen -- annars slapper webblasaren
      # inte fram nycklarna. Satts nar domanen ar klar (#73); listad har tom sa den inte glomms.
      - key: WebAuthn__RelyingPartyId
        sync: false

      - key: WebAuthn__Origins__0
        sync: false

      # Migrationer appliceras vid varje driftsattning.
      - key: Database__ApplyMigrationsOnStartup
        value: "true"

      # Startdata ar redan inlagd. Lamnas avstangd med avsikt: seeden ar idempotent
      # per naturlig nyckel, sa en match som en tranare tagit bort skulle komma
      # tillbaka vid nasta driftsattning.
      - key: Database__SeedOnStartup
        value: "false"

      - key: ASPNETCORE_ENVIRONMENT
        value: Production
